AUTO_RESUME: false
CUDNN:
  BENCHMARK: true
  DETERMINISTIC: false
  ENABLED: true
DATASET:
  DATASET: udd
  EXTRA_TRAIN_SET: ''
  NUM_CLASSES: 5
  ROOT: ${REPOSITORY}/datasets/udd
  TEST_SET: val.lst
  TRAIN_SET: train.lst
GPUS:
- 0
LOG_DIR: ${OUTPUT}_logs
LOSS:
  BALANCE_WEIGHTS:
  - 0.4
  - 1.0
  CLASS_BALANCE: false
  OHEMKEEP: 131072
  OHEMTHRES: 0.7
  SB_WEIGHTS: 0.0
  USE_OHEM: true
MODEL:
  ALIGN_CORNERS: true
  NAME: pidnet_m
  NUM_OUTPUTS: 2
  PRETRAINED: "${REPOSITORY}/pretrained/udd/imagenet/PIDNet_M_ImageNet.pth.tar"
OUTPUT_DIR: ${OUTPUT}
PIN_MEMORY: true
PRINT_FREQ: 10
TEST:
  BASE_SIZE: 512
  BATCH_SIZE_PER_GPU: 4
  FLIP_TEST: false
  IMAGE_SIZE:
  - 512
  - 512
  MODEL_FILE: ''
  MULTI_SCALE: false
  OUTPUT_INDEX: 1
TRAIN:
  BASE_SIZE: 512
  BATCH_SIZE_PER_GPU: 8
  BEGIN_EPOCH: 0
  END_EPOCH: 80
  EXTRA_EPOCH: 0
  EXTRA_LR: 0.001
  FLIP: true
  IGNORE_LABEL: 255
  IMAGE_SIZE:
  - 512
  - 512
  LR: 0.01
  MOMENTUM: 0.9
  MULTI_SCALE: true
  NESTEROV: false
  OPTIMIZER: sgd
  RESUME: false
  SCALE_FACTOR: 16
  SHUFFLE: true
  WD: 0.0005
WORKERS: 4
