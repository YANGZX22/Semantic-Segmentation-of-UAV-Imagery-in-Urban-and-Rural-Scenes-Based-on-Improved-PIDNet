CUDNN:
  BENCHMARK: true
  DETERMINISTIC: false
  ENABLED: true
GPUS: (0,)
OUTPUT_DIR: '${OUTPUT}'
LOG_DIR: '${OUTPUT}_logs'
WORKERS: 4
PRINT_FREQ: 10

DATASET:
  DATASET: UDD
  ROOT: '${REPOSITORY}/datasets/udd'
  TRAIN_SET: 'metadata/train.txt'
  TEST_SET: 'metadata/val.txt'
  NUM_CLASSES: 5                  # UDD5 为 5 类

MODEL:
  NAME: bisenet
  NUM_OUTPUTS: 2                  # 主头 + 辅助头
  # 也可以直接指定本地权重：'${REPOSITORY}/pretrained/udd/resnet18-5c106cde.pth'
  PRETRAINED: 'https://download.pytorch.org/models/resnet18-5c106cde.pth'
  ALIGN_CORNERS: true

LOSS:
  USE_OHEM: false                 # 与 Baseline 保持一致采用常规 CE
  OHEMTHRES: 0.7
  OHEMKEEP: 131072
  BALANCE_WEIGHTS: [1.0, 0.4]     # 主分支 1.0，辅助分支 0.4
  SB_WEIGHTS: 0.0

TRAIN:
  IMAGE_SIZE:
  - 512
  - 512
  BASE_SIZE: 512
  BATCH_SIZE_PER_GPU: 8
  SHUFFLE: true
  BEGIN_EPOCH: 0
  END_EPOCH: 80
  RESUME: false
  OPTIMIZER: sgd
  LR: 0.01
  WD: 0.0005
  MOMENTUM: 0.9
  NESTEROV: false
  FLIP: true
  MULTI_SCALE: true
  IGNORE_LABEL: 255
  SCALE_FACTOR: 16

TEST:
  IMAGE_SIZE:
  - 512
  - 512
  BASE_SIZE: 512
  BATCH_SIZE_PER_GPU: 4
  FLIP_TEST: false
  MULTI_SCALE: false
  MODEL_FILE: ''
  OUTPUT_INDEX: 0                 # 测试只取主分支