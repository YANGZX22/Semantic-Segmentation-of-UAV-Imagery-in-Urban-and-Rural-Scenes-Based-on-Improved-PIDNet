CUDNN:
  BENCHMARK: true
  DETERMINISTIC: false
  ENABLED: true
GPUS: (0,)
OUTPUT_DIR: '${OUTPUT}'
LOG_DIR: '${OUTPUT}_logs'
WORKERS: 4
PRINT_FREQ: 10

DATASET:
  DATASET: udd
  ROOT: '${REPOSITORY}/datasets/udd'
  TRAIN_SET: 'metadata/train.txt'
  TEST_SET: 'metadata/val.txt'
  NUM_CLASSES: 5                  # UDD5 对应 5 个类别

MODEL:
  NAME: hrnet
  NUM_OUTPUTS: 1
  # 保持指向你的 ImageNet 预训练权重
  PRETRAINED: '${REPOSITORY}/pretrained/udd/hrnet_w18_small_model_v2.pth'
  ALIGN_CORNERS: true

LOSS:
  USE_OHEM: true
  OHEMTHRES: 0.7
  OHEMKEEP: 131072
  BALANCE_WEIGHTS: [1.0]
  SB_WEIGHTS: 0.0

TRAIN:
  IMAGE_SIZE:
  - 512
  - 512
  BASE_SIZE: 512
  BATCH_SIZE_PER_GPU: 8
  SHUFFLE: true
  BEGIN_EPOCH: 0
  END_EPOCH: 80
  RESUME: false
  OPTIMIZER: sgd
  LR: 0.01
  WD: 0.0005
  MOMENTUM: 0.9
  NESTEROV: false
  FLIP: true
  MULTI_SCALE: true
  IGNORE_LABEL: 255
  SCALE_FACTOR: 16

TEST:
  IMAGE_SIZE:
  - 512
  - 512
  BASE_SIZE: 512
  BATCH_SIZE_PER_GPU: 4
  FLIP_TEST: false
  MULTI_SCALE: false
  MODEL_FILE: ''
  OUTPUT_INDEX: 0