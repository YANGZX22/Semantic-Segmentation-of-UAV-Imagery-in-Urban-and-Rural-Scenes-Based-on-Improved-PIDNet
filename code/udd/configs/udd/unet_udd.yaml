CUDNN:
  BENCHMARK: true
  DETERMINISTIC: false
  ENABLED: true
GPUS: (0,)
OUTPUT_DIR: '${OUTPUT}'
LOG_DIR: '${OUTPUT}_logs'
WORKERS: 4
PRINT_FREQ: 10

DATASET:
  DATASET: udd
  ROOT: '${REPOSITORY}/datasets/udd'
  TRAIN_SET: 'metadata/train.txt'
  TEST_SET: 'metadata/val.txt'
  NUM_CLASSES: 5

MODEL:
  NAME: unet
  NUM_OUTPUTS: 1
  PRETRAINED: ''
  ALIGN_CORNERS: true

LOSS:
  USE_OHEM: false
  BALANCE_WEIGHTS: [1.0]
  SB_WEIGHTS: 0.0

TRAIN:
  IMAGE_SIZE:
  - 512
  - 512
  BASE_SIZE: 512
  BATCH_SIZE_PER_GPU: 8
  SHUFFLE: true
  BEGIN_EPOCH: 0
  END_EPOCH: 80
  RESUME: false
  OPTIMIZER: adamw
  LR: 0.0005
  WD: 0.0001
  MOMENTUM: 0.9
  NESTEROV: false
  FLIP: true
  MULTI_SCALE: true
  IGNORE_LABEL: 255
  SCALE_FACTOR: 16

TEST:
  IMAGE_SIZE:
  - 512
  - 512
  BASE_SIZE: 512
  BATCH_SIZE_PER_GPU: 8
  FLIP_TEST: false
  MULTI_SCALE: false
  MODEL_FILE: ''
  OUTPUT_INDEX: 0